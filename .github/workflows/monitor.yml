name: Monitor
# Проверка сайтов каждые 5 минут по расписанию + ручной запуск

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [monitor]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ${{ github.repository }}-monitor
  cancel-in-progress: false

jobs:
  check:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.FINE_GRAINED_TOKEN || secrets.GH_PUT || github.token }}

      - name: Run monitor
        run: python monitor.py
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          GH_TOKEN: ${{ secrets.FINE_GRAINED_TOKEN || secrets.GH_PUT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-data
          path: |
            history/
            api/
          retention-days: 1

      - name: Trigger site deploy
        env:
          GH_TOKEN: ${{ secrets.FINE_GRAINED_TOKEN || secrets.GH_PUT || github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: runicore-monitor" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "{\"event_type\": \"site\", \"client_payload\": {\"run_id\": \"${GITHUB_RUN_ID}\"}}"
