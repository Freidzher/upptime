name: Monitor
# Проверка сайтов каждые 5 минут по расписанию + ручной запуск

on:
  schedule:
    - cron: "*/5 * * * *" # каждые 5 минут (GitHub может сдвигать до ~10 мин при высокой загрузке)
  repository_dispatch:
    types: [monitor]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.repository }}-monitor
  cancel-in-progress: false

jobs:
  check:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.FINE_GRAINED_TOKEN || secrets.GH_PUT || github.token }}

      - name: Run monitor
        run: python monitor.py
        env:
          # Все секреты разом (динамически) — monitor.py сам отфильтрует служебные
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          # Токен для API GitHub (создание/закрытие Issue-инцидентов)
          GH_TOKEN: ${{ secrets.FINE_GRAINED_TOKEN || secrets.GH_PUT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit history and trigger site deploy
        env:
          GH_TOKEN: ${{ secrets.FINE_GRAINED_TOKEN || secrets.GH_PUT || github.token }}
        run: |
          git config user.name "Runicore Bot"
          git config user.email "Freidzher@users.noreply.github.com"
          git add history/ api/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Monitor: update history"
            # Устойчивый push: подтягиваем чужие коммиты (параллельные прогоны) и ретраим
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              sleep $((i * 5))
            done
          fi
          # Явно запускаем деплой сайта: push от GITHUB_TOKEN не триггерит workflows
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: runicore-monitor" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type": "site", "client_payload": {}}'
