<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020b05">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" sizes="96x96" type="image/png" href="assets/icons/favicon-96x96.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/css/status.css?v=12">
  <title>Событие — Runicore</title>
  <style>
    /* Уникальные стили страницы события */
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 14px; }
    #evtTitle { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 2px 12px; }
    #evtTitle .ev-fav { width: 26px; height: 26px; border-radius: 6px; }
    #evtTitle .ev-fav.emoji { width: auto; height: auto; font-size: 24px; -webkit-text-fill-color: initial; }
    #evtTitle .title-sep { color: var(--muted); -webkit-text-fill-color: initial; }
    .evt {
      background: var(--card); border: 1px solid var(--border); border-left-width: 4px;
      border-radius: 12px; padding: 18px 20px; margin-bottom: 18px;
    }
    .evt.incident { border-left-color: var(--fail); }
    .evt.maintenance { border-left-color: var(--warn); }
    .evt.annulled { border-left-color: var(--gray); opacity: .75; }
    .evt.hidden { border-left-color: var(--gray); opacity: .6; }
    .evt .status { font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; }
    .evt.incident .status { color: var(--fail); }
    .evt.maintenance .status { color: var(--warn); }
    .evt.annulled .status, .evt.hidden .status { color: var(--gray); }
    .evt .meta { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 16px; }
    .evt .meta b { color: var(--text); }
    .evt .desc { font-size: .92rem; line-height: 1.55; white-space: pre-line; margin-top: 14px; }
    .evt .desc b { color: var(--text); }

    /* Комментарии администратора (из GitHub Issues) */
    .comments { margin-top: 0; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .comment {
      background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 12px 16px; backdrop-filter: blur(8px);
    }
    .comment-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
    .comment-head b { color: #52f099; font-size: .9rem; }
    .comment-time { color: var(--muted); font-size: .78rem; }
    .comment-body { font-size: .92rem; line-height: 1.5; white-space: pre-line; word-break: break-word; }
    .service-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .service-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(46, 204, 113, 0.1); border: 1px solid var(--border);
      color: #52f099; text-decoration: none; border-radius: 10px;
      padding: 8px 14px; font-size: .85rem; font-weight: 600; transition: background .2s, border-color .2s;
    }
    .service-btn:hover { background: rgba(46, 204, 113, 0.2); border-color: rgba(46, 204, 113, .5); }
    .service-btn .ev-fav { width: 18px; height: 18px; border-radius: 4px; }
    .service-btn .ev-fav.emoji { width: auto; height: auto; font-size: 16px; -webkit-text-fill-color: initial; }
    /* На странице события кнопки уходят вниз — уменьшаем зазор до футера */
    footer { margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← К списку сервисов</a>
    <h1><span id="evtTitle">Загрузка…</span></h1>
    <div class="comments" id="evtComments" style="display:none"></div>
    <div class="evt incident" id="evtCard">
      <div class="status" id="evtStatus">…</div>
      <div class="meta" id="evtMeta"></div>
      <div class="desc" id="evtDesc"></div>
    </div>
    <div class="service-links" id="serviceLinks" style="display:none"></div>
    <footer>© 2024–<span id="year"></span> Runicore. Все права защищены.</footer>
  </div>

  <script src="assets/js/common.js?v=12"></script>
  <script src="assets/js/incident.js?v=11"></script>
</body>
</html>
