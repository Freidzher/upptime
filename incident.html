<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020b05">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" sizes="96x96" type="image/png" href="assets/icons/favicon-96x96.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/css/status.css?v=2">
  <title>Событие — Runicore</title>
  <style>
    /* Уникальные стили страницы события */
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
    .evt {
      background: var(--card); border: 1px solid var(--border); border-left-width: 4px;
      border-radius: 12px; padding: 18px 20px; margin-bottom: 18px;
    }
    .evt.incident { border-left-color: var(--fail); }
    .evt.maintenance { border-left-color: var(--warn); }
    .evt.annulled { border-left-color: var(--gray); opacity: .75; }
    .evt.hidden { border-left-color: var(--gray); opacity: .6; }
    .evt .status { font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; }
    .evt.incident .status { color: var(--fail); }
    .evt.maintenance .status { color: var(--warn); }
    .evt.annulled .status, .evt.hidden .status { color: var(--gray); }
    .evt .meta { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 14px; }
    .evt .meta b { color: var(--text); }
    .evt .desc { font-size: .92rem; line-height: 1.55; white-space: pre-line; }
    .evt .desc b { color: var(--text); }
    .service-link {
      display: inline-block; background: rgba(46, 204, 113, 0.1); border: 1px solid var(--border);
      color: #52f099 !important; text-decoration: none; border-radius: 10px;
      padding: 9px 16px; font-size: .88rem; font-weight: 600; transition: background .2s, border-color .2s;
    }
    .service-link:hover { background: rgba(46, 204, 113, 0.2); border-color: rgba(46, 204, 113, .5); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← К списку сервисов</a>
    <h1 id="evtTitle">Загрузка…</h1>
    <div class="evt incident" id="evtCard">
      <div class="status" id="evtStatus">…</div>
      <div class="meta" id="evtMeta"></div>
      <div class="desc" id="evtDesc"></div>
    </div>
    <a class="service-link" id="serviceLink" style="display:none" href="#">Страница сервиса →</a>
    <footer>© 2024–<span id="year"></span> Runicore. Все права защищены.</footer>
  </div>

  <script src="assets/js/common.js?v=1"></script>
  <script src="assets/js/incident.js?v=4"></script>
</body>
</html>
