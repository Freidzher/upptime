<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020b05">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" sizes="96x96" type="image/png" href="assets/favicon-96x96.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="assets/manifest.json">
  <title>Runicore (Мониторинг)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #020b05;
      --card: rgba(4, 26, 12, 0.75);
      --border: rgba(46, 204, 113, 0.2);
      --accent: #2ecc71;
      --ok: #00ff88;
      --fail: #ff4f6d;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(46, 204, 113, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(46, 204, 113, 0.04) 1px, transparent 1px),
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(46, 204, 113, 0.08) 0%, transparent 50%);
      background-size: 50px 50px, 50px 50px, auto, auto;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 60px 20px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 {
      font-size: 2.2rem; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 40%, #2ecc71 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { color: var(--muted); margin-bottom: 28px; }
    .banner {
      border-radius: 14px; padding: 14px 20px; margin-bottom: 8px;
      background: var(--card); border: 1px solid var(--border);
      font-weight: 600; font-size: .95rem;
    }
    .banner.ok { border-color: rgba(46,204,113,.4); }
    .banner.fail { border-color: var(--fail); }
    .updated { text-align: right; color: var(--muted); font-size: .78rem; margin-bottom: 24px; }

    /* Группы серверов */
    .group-head {
      display: flex; align-items: center; gap: 12px;
      background: rgba(10, 40, 20, 0.65); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 18px; margin: 18px 0 8px;
      font-weight: 700; backdrop-filter: blur(8px);
      text-decoration: none; color: var(--text);
      transition: border-color .25s, background .25s;
    }
    .group-head:hover { border-color: rgba(46, 204, 113, 0.55); background: rgba(6, 36, 16, 0.85); }
    .group-head .favicon { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
    .group-head .favicon.emoji { font-size: 18px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .group-head .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .group-head .dot.up { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .group-head .dot.down { background: var(--fail); box-shadow: 0 0 8px var(--fail); }
    .group-head .name { flex: 1; color: var(--text); }
    .group-head .group-status { font-size: .82rem; color: var(--muted); font-weight: 500; }

    /* Компактные строки на главной */
    .row {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 18px; margin-bottom: 10px; cursor: pointer;
      transition: border-color .25s, background .25s;
      backdrop-filter: blur(8px);
      text-decoration: none;
      color: var(--text);
    }
    .row.nested { margin-left: 20px; width: calc(100% - 20px); }
    .row:hover { border-color: rgba(46, 204, 113, 0.55); background: rgba(6, 36, 16, 0.85); }
    .row .favicon { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
    .row .favicon.emoji { font-size: 18px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .row .dot.up { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .row .dot.down { background: var(--fail); box-shadow: 0 0 8px var(--fail); }
    .row .name { font-weight: 600; flex: 1; color: var(--text); }
    .row .uptime { color: var(--muted); font-size: .88rem; }
    .row .uptime b { color: var(--text); }
    .row .chevron { color: var(--muted); transition: transform .25s; }

    /* Детальная панель */
    .detail {
      max-height: 0; overflow: hidden; transition: max-height .35s ease;
    }
    .detail.open { max-height: 700px; }
    .detail-inner {
      background: rgba(4, 20, 10, 0.85); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 12px 12px;
      padding: 18px; margin: -10px 0 14px;
    }
    .detail-inner .meta { color: var(--muted); font-size: .88rem; display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
    .detail-inner .meta b { color: var(--text); }
    canvas { width: 100%; height: 90px; }
    .inc-title { margin: 34px 0 12px; font-size: 1.1rem; font-weight: 700; }
    .inc-subtitle { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 8px; }
    .incident {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 8px; font-size: .88rem;
    }
    .incident a { color: #52f099; text-decoration: none; }
    .incident .t { color: var(--muted); font-size: .8rem; margin-top: 4px; }
    footer {
      text-align: center; margin-top: 50px; padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,.05);
      color: var(--muted); font-size: .82rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Мониторинг сети Runicore</h1>
    <p class="sub">Нажмите на сервис — откроется страница со статистикой.</p>
    <div class="banner ok" id="banner">⏳ Загрузка…</div>
    <div class="updated" id="updated"></div>
    <div id="rows"></div>
    <div class="inc-title" id="liveTitle" style="display:none">Живой статус</div>
    <div id="live"></div>
    <div class="inc-title" id="incTitle" style="display:none">Активные инциденты</div>
    <div id="incidents"></div>
    <div class="inc-title" id="maintTitle" style="display:none">Плановые работы</div>
    <div id="maintenance"></div>
    <div class="inc-title" id="pastTitle" style="display:none">Прошлые инциденты</div>
    <div id="past"></div>
    <footer>© 2024–<span id="year"></span> Runicore. Все права защищены.</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="assets/app.js?v=3"></script>
</body>
</html>
