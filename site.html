<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020b05">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" sizes="96x96" type="image/png" href="assets/favicon-96x96.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="assets/manifest.json">
  <title>Статистика — Runicore</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #0b0102;
      --card: rgba(26, 4, 10, 0.7);
      --border: rgba(255, 79, 139, 0.2);
      --accent: #ff4f8b;
      --ok: #2ecc71;
      --fail: #ff4f6d;
      --text: #fff;
      --muted: rgba(255,255,255,0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(255,79,139,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,79,139,0.04) 1px, transparent 1px),
        radial-gradient(circle at 10% 20%, rgba(184,20,79,0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255,79,139,0.1) 0%, transparent 50%);
      background-size: 50px 50px, 50px 50px, auto, auto;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 60px 20px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .back { color: var(--muted); text-decoration: none; font-size: .88rem; display: inline-block; margin-bottom: 18px; }
    .back:hover { color: var(--accent); }
    h1 {
      font-size: 2rem; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 40%, #ff8e9e 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .banner {
      border-radius: 14px; padding: 14px 20px; margin-bottom: 8px;
      background: var(--card); border: 1px solid var(--border);
      font-weight: 600; font-size: .95rem;
    }
    .banner.ok { border-color: rgba(46,204,113,.4); }
    .banner.fail { border-color: var(--fail); }
    .updated { text-align: right; color: var(--muted); font-size: .78rem; margin-bottom: 24px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; backdrop-filter: blur(8px);
    }
    .stat .v { font-size: 1.25rem; font-weight: 700; }
    .stat .l { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .chart-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; margin-bottom: 24px; backdrop-filter: blur(8px);
    }
    .chart-title { font-weight: 700; margin-bottom: 12px; font-size: 1rem; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabs button {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: .82rem;
    }
    .tabs button.active { border-color: var(--accent); color: var(--text); }
    canvas { width: 100%; height: 160px; }
    .inc-title { margin: 18px 0 10px; font-weight: 700; font-size: .95rem; }
    .incident {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 8px; font-size: .88rem;
    }
    .incident a { color: #ff8ab3; text-decoration: none; }
    footer {
      text-align: center; margin-top: 50px; padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,.05);
      color: var(--muted); font-size: .82rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← К списку сервисов</a>
    <h1 id="siteName">Загрузка…</h1>
    <div class="banner ok" id="banner">⏳ Загрузка…</div>
    <div class="updated" id="updated"></div>
    <div class="stats" id="stats"></div>
    <div class="chart-card">
      <div class="chart-title">Время отклика</div>
      <div class="tabs" id="rangeTabs">
        <button data-r="24">24ч</button>
        <button data-r="168">7д</button>
        <button data-r="720">30д</button>
        <button data-r="8760">1г</button>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="inc-title" id="pastTitle" style="display:none">Прошлые инциденты</div>
    <div id="past"></div>
    <footer>© 2026 Runicore — страница статуса</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="assets/site.js"></script>
</body>
</html>
