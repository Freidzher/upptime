<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020b05">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" sizes="96x96" type="image/png" href="assets/icons/favicon-96x96.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/css/status.css?v=2">
  <title>Статистика — Runicore</title>
  <style>
    /* Уникальные стили страницы сервиса */
    .updated { margin-bottom: 24px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; backdrop-filter: blur(8px);
    }
    .stat .v { font-size: 1.25rem; font-weight: 700; }
    .stat .l { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .chart-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; margin-bottom: 24px; backdrop-filter: blur(8px);
    }
    .chart-title { font-weight: 700; margin-bottom: 12px; font-size: 1rem; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tabs button {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: .82rem; transition: all 0.2s;
    }
    .tabs button.active { border-color: var(--accent); color: var(--text); background: rgba(46, 204, 113, 0.15); }
    canvas { width: 100%; height: 160px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← К списку сервисов</a>
    <h1><span class="dot up" id="siteDot" style="display:none; width:14px; height:14px; vertical-align:middle; margin-right:10px;"></span><img class="favicon" id="siteFavicon" src="" alt="" style="display:none; width:32px; height:32px; border-radius:8px; vertical-align:middle; margin-right:10px;"><span id="siteName">Загрузка…</span></h1>
    <div class="banner ok" id="banner" style="display:none">⏳ Загрузка…</div>
    <div class="updated" id="updated"></div>
    <div class="stats" id="stats"></div>
    <div class="chart-card">
      <div class="chart-title">Время отклика</div>
      <div class="tabs" id="rangeTabs">
        <button data-r="24">24ч</button>
        <button data-r="168">7д</button>
        <button data-r="720">30д</button>
        <button data-r="8760">1г</button>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="inc-title" id="pastTitle" style="display:none">Прошлые события</div>
    <div id="past"></div>
    <footer>© 2024–<span id="year"></span> Runicore. Все права защищены.</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="assets/js/common.js?v=1"></script>
  <script src="assets/js/site.js?v=9"></script>
</body>
</html>
